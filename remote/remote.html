<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles.css">
    <!-- <title>Local WebRTC Build</title> -->
</head>
<body class="local">
    <h1>REMOTE NODE</h1>
    <div class="container">
        

        <div class="video-div">
            <label for="multiview-video-monitor">Multiviewer Monitor</label>
            <video id="multiview-video-monitor" muted autoplay></video>
            <audio id = "pgm-audio-monitor"controls muted autoplay></audio>
            <label for="pgm-audio-monitor">Programme Audio Monitor</label>
        </div>
       
        <div class="input">
            
            <label for="comms-audio-input-select">Comms Audio Input: </label>
            <select id="comms-audio-input-select"></select>
            </select>
            <label for="local-comms-audio-monitor">Local Comms Monitor</label>
            <audio controls muted autoplay id="local-comms-audio-monitor"></audio>
            <label for="remote-comms-audio-monitor">Remote Comms Monitor</label>
            <audio controls muted autoplay id="remote-comms-audio-monitor"></audio>
        
        <button id="join-call-button">Join Call</button>
        <button id="update-monitors-button">Update Monitors</button>
        <button id="inspect-button">INSPECT</button>
        </div>
        
    </div>
    <script type = "module" src="remote.js"></script>
    
</body>
</html>
