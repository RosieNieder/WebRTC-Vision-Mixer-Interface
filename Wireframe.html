<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Multiview UI (Single Video)</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
      background: #f9f9f9;
    }
    .container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      align-items: start;
    }
    .panel {
      background: white;
      border: 2px solid #ccc;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
    }
    .multiview-monitor {
      grid-column: 1 / span 3;
      text-align: center;
      margin-bottom: 20px;
    }
    .multiview-monitor video {
      width: 100%;
      max-height: 400px;
      border: 3px solid #333;
      border-radius: 6px;
      background: #000;
    }
    .form-group {
      margin-bottom: 10px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    .form-group select, .form-group input {
      width: 100%;
      padding: 6px;
      border: 1px solid #999;
      border-radius: 4px;
    }
    .button {
      background: #28a745;
      color: white;
      padding: 10px;
      border: none;
      width: 100%;
      cursor: pointer;
      border-radius: 4px;
      font-weight: bold;
      margin-top: 10px;
    }
    .slider-container {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      height: 120px;
      gap: 15px;
    }
    .slider {
      width: 20px;
      height: 100%;
      background: #ccc;
      border: 1px solid #888;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .slider-fill {
      width: 100%;
      height: 60%;
      background: limegreen;
    }
    .caption {
      text-align: center;
      margin-top: 5px;
      font-size: 12px;
    }
    .question-box {
      grid-column: 1 / span 3;
      background: #fffbe6;
      padding: 15px;
      border: 1px dashed #999;
      font-style: italic;
    }
    .headset {
      grid-column: 2 / span 1;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- Multiview Display (Single Video Feed) -->
    <div class="multiview-monitor">
      <video controls autoplay muted>
        <source src="path-to-multiview.mp4" type="video/mp4" />
        Your browser does not support the video tag.
      </video>
      <p><strong>Multiview Feed</strong> (PVW, PGM, Cams, Clock combined)</p>
    </div>

    <!-- Local Configuration Panel -->
    <div class="panel">
      <h3>Local Configuration</h3>
      <div class="form-group">
        <label>Comms Input</label>
        <select>
          <option>Comms Input Selection</option>
        </select>
      </div>
      <div class="form-group">
        <label>Comms Output</label>
        <select>
          <option>Comms Output Selection</option>
        </select>
      </div>
      <div class="form-group">
        <label>Video Input</label>
        <select>
          <option>Video Input Selection</option>
        </select>
      </div>
      <div class="form-group">
        <label>Audio Input</label>
        <select>
          <option>Audio Input Selection</option>
        </select>
      </div>
      <div class="form-group">
        <label>Bitrate / Framerate / Resolution</label>
        <input type="text" placeholder="e.g. 3000kbps / 30fps / 1080p">
      </div>
      <button class="button">Start Stream</button>
    </div>

    <!-- Local Confidence Monitoring -->
    <div class="panel">
      <h3>Local Confidence Monitoring</h3>
      <div class="slider-container">
        <div class="slider"><div class="slider-fill"></div></div>
      </div>
      <div class="caption">PGM Comms</div>
    </div>

    <!-- Remote Audio Mixing -->
    <div class="panel">
      <h3>Remote Audio Mixing</h3>
      <div class="slider-container">
        <div class="slider"><div class="slider-fill"></div></div>
        <div class="slider"><div class="slider-fill"></div></div>
      </div>
    </div>

    <!-- Headset Visual -->
    <div class="headset">
      🎧 Headset and Laptop Connected
    </div>

    <!-- Embedded Audio Device Question -->
    <div class="question-box">
      <p><strong>Question:</strong> How are devices with embedded audio handled?<br><em>e.g. Webcam input with audio?</em></p>
    </div>

  </div>

</body>
</html>
