<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles.css">

</head>
<body class="local">
    <div class="container">
        <div>
            <button onclick="attachMediaToConnection()">Update Devices</button>
            <button onclick = "startCall()">Start Call</button>
            <button onclick="hangUp()">Stop</button>
        </div> 
    <!-- <canvas id="oscilloscope"> </canvas> -->
    <div class="video-div">
    <video id="local-video" muted autoplay></video>
    </div>
    <label for="pgm-video-selection">Programme Video Input: </label>
            <select id="pgm-video-selection"></select>
            <label for="pgm-audio-selection">Programme Audio Input: </label>
            <select id="pgm-audio-selection"></select>
            <label for="comms-input-selection">Comms Audio Input: </label>
            <select id="comms-input-selection"></select>
            <label for="comms-output-selection">Comms Audio Output: </label>
            <select id="comms-output-selection"></select>
            
            <label for="monitor-output-selection">Monitor Audio Output: </label>
            <select id="monitor-output-selection"></select>

            <input
            type="range"
            id="comms-volume-control"
            min="0"
            max="4"
            value="1"

            step="0.01"
            />
        
          <label for="comms-volume-control">Comms</label>


          <input
          type="range"
          id="pgm-volume-control"
          min="0"
          max="2"
          value="1"
          step="0.01"
          />
         
        <label for="pgm-volume-control">PGM</label>
    <div class="audio-div">
    <audio autoplay controls id="pgm-audio-monitor"></audio>
    <label for="pgm-audio-monitor">PGM Audio Monitor</label>
    <audio autoplay controls id="comms-audio-monitor"></audio>
    <label for="comms-audio-monitor">Outgoing Comms Audio Monitor</label>

    <audio autoplay controls id="remote-comms"></audio>
    <label for="remote-comms">Remote Comms Audio Monitor</label>
    </div>
    </div>
    <script type="module" src="main.js"></script>
</body>
</html>
