<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles.css">
    <!-- <title>Local WebRTC Build</title> -->
</head>
<body class="local">
    <h1>LOCAL NODE</h1>
    <div class="container">
        

        <div class="video-div">
            <label for="multiview-video-monitor">Multiviewer Monitor</label>
            <video id="multiview-video-monitor" muted autoplay></video>
            <audio id = "pgm-audio-monitor"controls autoplay></audio>
            <label for="pgm-audio-monitor">Programme Audio Monitor</label>
        </div>
        <!-- <video id="remote-video" autoplay></video> -->
        <!-- <input placeholder="Enter IP Address..." id="ipAddressField">
        <button onclick="getipAddress()">Submit</button> -->
        <div class="input">
            <label for="multiviewer-input-select">Multiviewer Input: </label>
            <select id="multiviewer-input-select"></select>
            <label for="programme-audio-input-select">Programme Audio Input: </label>
            <select id="programme-audio-input-select"></select>
            <label for="comms-audio-input-select">Comms Audio Input: </label>
            <select id="comms-audio-input-select"></select>
            <!-- <label for="remote-operator-type">Remote Operator: </label>
            <select id="remote-operator-type">
                <option>Vision</option>
                <option>Autoscript Operator</option> -->
            </select>
            <label for="local-comms-audio-monitor">Local Comms Monitor</label>
            <audio controls autoplay id="local-comms-audio-monitor"></audio>
        
        <button id="send-user-button">Send User To Server</button>
        <button id="confirm-input-devices-button" >Confirm Devices</button>
        <button id="start-call-button">Start Call</button>
        <button id="inspect-button">INSPECT</button>
        </div>
        
    </div>
    <script type = "module" src="local.js"></script>
    
</body>
</html>
